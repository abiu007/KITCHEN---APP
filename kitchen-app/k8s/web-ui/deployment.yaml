apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-config
  namespace: kitchen-app
data:
  nginx.conf: |
    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api-nodeport:3000/;
        }

        location /health {
            access_log off;
            return 200 'OK';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard</title>

    <style>
    body { margin:0; font-family:Segoe UI; background:#f4f6f9; }
    header { background:#ff6b35; color:white; padding:15px; text-align:center; font-size:22px; }
    .container { display:flex; gap:20px; padding:20px; }
    .panel { flex:1; background:white; padding:15px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.1); }
    input { padding:10px; width:70%; }
    button { padding:10px; background:#ff6b35; color:white; border:none; cursor:pointer; }
    .order-card { background:#fafafa; border-left:5px solid #ff6b35; margin:10px 0; padding:10px; }
    .online { color:green; }
    .offline { color:red; }
    </style>
    </head>

    <body>
    <header>🍽️ Kitchen Dashboard</header>

    <div class="container">

      <div class="panel">
        <h2>Create Order</h2>
        <input id="dish" placeholder="Dish name" />
        <button onclick="createOrder()">Add</button>
        <p>API: <span id="apiStatus" class="offline">Checking...</span></p>
        <p id="msg"></p>
      </div>

      <div class="panel">
        <h2>Orders</h2>
        <button onclick="loadOrders()">Refresh</button>
        <div id="orders"></div>
      </div>

    </div>

    <script>
    const API="/api";

    async function checkHealth(){
      try{
        const r=await fetch(API+"/health");
        const d=await r.json();
        document.getElementById("apiStatus").innerText="Online ("+d.db+")";
        document.getElementById("apiStatus").className="online";
      }catch{
        document.getElementById("apiStatus").innerText="Offline";
      }
    }

    async function loadOrders(){
      const el=document.getElementById("orders");
      el.innerHTML="Loading...";
      try{
        const r=await fetch(API+"/orders");
        const data=await r.json();
        el.innerHTML=data.reverse().map(o=>`
          <div class="order-card">
            <b>${o.dish}</b><br/>
            ${o.status}<br/>
            <small>${o._id}</small>
          </div>`).join("");
      }catch{
        el.innerHTML="Error loading";
      }
    }

    async function createOrder(){
      const dish=document.getElementById("dish").value;
      if(!dish)return;
      await fetch(API+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dish})});
      loadOrders();
    }

    checkHealth();
    loadOrders();
    setInterval(checkHealth,8000);
    setInterval(loadOrders,5000);
    </script>

    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-deployment
  namespace: kitchen-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kitchen-web-ui
  template:
    metadata:
      labels:
        app: kitchen-web-ui
    spec:
      containers:
        - name: web-ui
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-ui-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: web-ui-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
      volumes:
        - name: web-ui-config
          configMap:
            name: web-ui-config

---
apiVersion: v1
kind: Service
metadata:
  name: web-ui-service
  namespace: kitchen-app
spec:
  type: NodePort
  selector:
    app: kitchen-web-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080