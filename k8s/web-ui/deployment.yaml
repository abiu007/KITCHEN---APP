# =================================================================
# 5-STAR KITCHEN WEB UI CONFIGURATION (NGINX + DASHBOARD + DEPLOY)
# =================================================================

# -----------------------------------------------------------------
# ConfigMap: NGINX + HTML/JS/CSS
# -----------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-config
  namespace: kitchen-app
data:
  nginx.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api-nodeport:3000/;
        }

        location /health {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>🍽️ 5-Star Kitchen Dashboard</title>
      <style>
        body { font-family: 'Segoe UI', sans-serif; background:#0d1117; color:#e5e7eb; margin:0; }
        header { background:#ff6b35; color:white; padding:20px; text-align:center; font-size:28px; font-weight:bold; }
        .container { display:flex; flex-wrap:wrap; gap:20px; padding:20px; justify-content:center; }
        .panel { background:#1f1f2e; border-radius:12px; padding:20px; flex:1 1 400px; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
        h2 { margin-top:0; color:#ffd700; }
        input { padding:10px; width:70%; border-radius:8px; border:none; margin-right:10px; }
        button { padding:10px 15px; border-radius:8px; border:none; background:#00c2cb; color:white; font-weight:bold; cursor:pointer; }
        button:hover { background:#00a7b0; }
        .order-card { background:#2e2e44; border-left:5px solid #ff6b35; margin:12px 0; padding:12px; border-radius:8px; }
        .status { font-weight:bold; }
        .online { color:#00ff90; }
        .offline { color:#ff4c4c; }
      </style>
    </head>
    <body>
      <header>🍽️ 5-Star Kitchen Dashboard</header>
      <div class="container">
        <div class="panel">
          <h2>Create Order</h2>
          <input id="dish" placeholder="Enter dish name" />
          <button onclick="createOrder()">Add Order</button>
          <p>Status: <span id="apiStatus" class="offline">Checking...</span></p>
          <p id="msg"></p>
        </div>

        <div class="panel">
          <h2>Current Orders</h2>
          <button onclick="loadOrders()">Refresh Orders</button>
          <div id="orders"></div>
        </div>
      </div>

      <script>
        const API="/api";

        async function checkHealth() {
          try {
            const r = await fetch(API+"/health");
            const d = await r.json();
            const el=document.getElementById("apiStatus");
            el.innerText="Online ("+d.db+")"; el.className="online";
          } catch {
            const el=document.getElementById("apiStatus");
            el.innerText="Offline"; el.className="offline";
          }
        }

        async function loadOrders() {
          const el=document.getElementById("orders"); el.innerHTML="Loading...";
          try {
            const r = await fetch(API+"/orders");
            const data = await r.json();
            el.innerHTML = data.reverse().map(o=>`
              <div class="order-card">
                <div><b>Dish:</b> ${o.dish}</div>
                <div class="status"><b>Status:</b> ${o.status}</div>
                <div><small>ID: ${o._id}</small></div>
              </div>`).join("");
          } catch { el.innerHTML="Error loading orders"; }
        }

        async function createOrder() {
          const dish=document.getElementById("dish").value; if(!dish) return;
          await fetch(API+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dish})});
          document.getElementById("dish").value=""; loadOrders();
        }

        checkHealth(); loadOrders(); setInterval(checkHealth,8000); setInterval(loadOrders,5000);
      </script>
    </body>
    </html>

# -----------------------------------------------------------------
# Web UI Deployment
# -----------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-deployment
  namespace: kitchen-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kitchen-web-ui
  template:
    metadata:
      labels:
        app: kitchen-web-ui
    spec:
      containers:
        - name: kitchen-web-ui
          image: kitchen-web-ui:v3   # <-- your custom image for rolling update
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-ui-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: web-ui-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
      volumes:
        - name: web-ui-config
          configMap:
            name: web-ui-config

# -----------------------------------------------------------------
# Web UI NodePort Service
# -----------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: web-ui-service
  namespace: kitchen-app
spec:
  type: NodePort
  selector:
    app: kitchen-web-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080